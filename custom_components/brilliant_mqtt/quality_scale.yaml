# Integration Quality Scale Tracking
# https://developers.home-assistant.io/docs/core/integration-quality-scale
#
# Status values: done, todo, exempt
# For exempt rules, include a comment explaining why.
#
# This HACS custom component owns one Brilliant fleet hub config entry with
# per-panel config subentries. Each panel agent publishes native MQTT Discovery
# devices while the integration adds panel management entities and coordinates
# MQTT validation, SSH provisioning, repair, and update lifecycles.

rules:
  # =============================================================================
  # Bronze Tier (Baseline Requirements)
  # =============================================================================

  action-setup:
    status: done
    comment: repair/redeploy/uninstall registered in async_setup (not async_setup_entry).

  appropriate-polling:
    status: exempt
    comment: Push-based (local_push) — state comes from retained MQTT topics, refreshed via a dispatcher signal; nothing polls.

  brands:
    status: exempt
    comment: HACS custom integration; brand assets are bundled in brand/ (HA 2026.3 brands proxy API), not submitted to the core home-assistant/brands repo.

  common-modules:
    status: done
    comment: Shared entity behavior lives in entity.py; FleetManager owns entry-wide resources and delegates panel state to PanelManager.

  config-flow:
    status: done
    comment: The flow creates one singleton fleet, validates either the recommended official Mosquitto add-on or an existing broker, then manages panels as config subentries.

  config-flow-test-coverage:
    status: done
    comment: ha/tests/test_config_flow.py covers fleet bootstrap, broker validation, panel onboarding, subentry reconfiguration, options, races, and error paths.

  dependency-transparency:
    status: done
    comment: All pinned runtime dependencies (asyncssh, aiomqtt, and paho-mqtt) are declared in manifest requirements.

  docs-actions:
    status: done
    comment: repair/redeploy/uninstall documented in services.yaml, strings.json, and docs/ha-integration.md (Services).

  docs-high-level-description:
    status: done
    comment: README and docs/ha-integration.md describe what the integration does.

  docs-installation-instructions:
    status: done
    comment: INSTALL.md and docs/ha-integration.md (Install) cover HACS and manual install.

  docs-removal-instructions:
    status: done
    comment: docs/ha-integration.md and docs/reference/deployment.md (Rollback) cover removal/uninstall and discovery cleanup.

  entity-event-setup:
    status: done
    comment: Entities subscribe to the manager's dispatcher signal in async_added_to_hass and unsubscribe via async_on_remove.

  entity-unique-id:
    status: done
    comment: Every entity derives _attr_unique_id from its panel's stable management identity plus its role.

  has-entity-name:
    status: done
    comment: BrilliantPanelEntity sets _attr_has_entity_name = True.

  runtime-data:
    status: done
    comment: FleetManager is stored in entry.runtime_data (typed BrilliantMqttConfigEntry) and exposes its panel runtimes through a read-only mapping.

  test-before-configure:
    status: done
    comment: Panel onboarding fetches the SSH host identity before password authentication, then performs a pinned read-only inspection before any provisioning write.

  test-before-setup:
    status: done
    comment: async_setup_entry gates on mqtt.async_wait_for_mqtt_client → ConfigEntryNotReady if the broker isn't ready.

  unique-config-entry:
    status: done
    comment: The singleton fleet uses the fixed brilliant_mqtt_fleet unique ID; each panel subentry uses its verified SSH host-key fingerprint as unique_id.

  # =============================================================================
  # Silver Tier (Reliability & Robustness)
  # =============================================================================

  action-exceptions:
    status: done
    comment: Service handlers raise HomeAssistantError (translated) on failure; multi-target ops aggregate per-panel failures into one error.

  config-entry-unloading:
    status: done
    comment: async_unload_entry unloads platforms and calls FleetManager.async_shutdown, which drains every panel timer, task, and MQTT subscription.

  docs-configuration-parameters:
    status: done
    comment: Fleet broker, HA-control, scenes, resilience defaults, mesh priorities, and bounded per-panel feature overrides are documented in strings.json and docs/ha-integration.md.

  docs-installation-parameters:
    status: done
    comment: Fleet creation, both equal-level broker choices, validation stages, and the Add panel fields are documented in strings.json, INSTALL.md, and docs/ha-integration.md.

  entity-unavailable:
    status: exempt
    comment: These are local management entities whose purpose is to stay operable during an outage (the repair button must remain pressable when the panel is offline); panel availability is surfaced via the bridge-health PROBLEM sensor + its availability attribute and the agent's own MQTT-discovery LWT.

  integration-owner:
    status: done
    comment: "@btli is listed in manifest codeowners."

  log-when-unavailable:
    status: done
    comment: PanelManager._on_availability logs (info) the offline→grace transition.

  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES = 0 in binary_sensor.py, button.py, update.py, switch.py, and select.py (push-only platforms; SSH is serialized by a fleet-wide lock).

  reauthentication-flow:
    status: exempt
    comment: There is no cloud/OAuth session. MQTT credentials use the validated broker settings flow; panel credential repair requires the exact pinned identity, while replacement identity requires an explicit confirmed rebind.

  test-coverage:
    status: done
    comment: The pytest suite covers the manager state machine, services, config flow, entities, diagnostics, shell, and repair issues.

  # =============================================================================
  # Gold Tier (Premium User Experience)
  # =============================================================================

  devices:
    status: done
    comment: Entities attach to the panel's device via DeviceInfo in entity.py (claims the agent's mqtt-discovery identifier).

  diagnostics:
    status: done
    comment: diagnostics.py returns allowlisted fleet health, panel configuration/runtime state, and provisioning count/phase while excluding credentials and raw journal contents.

  discovery:
    status: exempt
    comment: Panels are added manually as subentries below the singleton fleet; they expose no network discovery protocol for this management surface.

  discovery-update-info:
    status: exempt
    comment: No discovery (see discovery); address and credentials use pinned-identity subentry flows, and replacement hardware requires explicit confirmed rebind.

  docs-data-update:
    status: done
    comment: docs/ha-integration.md and docs/ARCHITECTURE.md describe the push (MQTT retained state + LWT) model and the OTA repair state machine.

  docs-examples:
    status: done
    comment: docs/ha-integration.md (Events) includes automation examples for needs_attention and repair outcomes.

  docs-known-limitations:
    status: done
    comment: docs/ha-integration.md ("What it manages (and what it does not)") states the limitations.

  docs-supported-devices:
    status: done
    comment: README documents the supported Brilliant Smart Home Control panels (and which "Brilliant" products are not supported).

  docs-supported-functions:
    status: done
    comment: docs/ha-integration.md (Entities, Services, Events) documents every entity, service, and event.

  docs-troubleshooting:
    status: done
    comment: docs/TROUBLESHOOTING.md covers common problems and fixes.

  docs-use-cases:
    status: done
    comment: README (Why this over HomeKit Controller) and docs/ha-integration.md (Events) cover the use cases.

  dynamic-devices:
    status: done
    comment: FleetManager reconciles panel subentry additions and removals, with an entry reload when platform entities must be rebuilt.

  entity-category:
    status: done
    comment: The bridge-health sensor and repair button use EntityCategory.DIAGNOSTIC.

  entity-device-class:
    status: done
    comment: The bridge-health binary_sensor uses BinarySensorDeviceClass.PROBLEM.

  entity-disabled-by-default:
    status: exempt
    comment: All are management/config entities (health, repair, update, voice-satellite switch, wake-word select) that are always relevant; none are noisy enough to disable by default.

  entity-translations:
    status: done
    comment: Each entity sets _attr_translation_key with an "entity" block in strings.json and translations/en.json.

  exception-translations:
    status: done
    comment: User-surfaced HomeAssistantErrors raise with translation_domain/translation_key; messages in the "exceptions" block.

  icon-translations:
    status: exempt
    comment: Entities rely on device-class default icons (PROBLEM binary_sensor, button, update); no per-state custom icons are needed.

  reconfiguration-flow:
    status: done
    comment: Focused panel subentry flows rename, change address, repair credentials, or explicitly rebind replacement hardware while preserving the immutable panel slug.

  repair-issues:
    status: done
    comment: Escalations create an issue_registry repair issue (translation_key needs_attention) and delete it on recovery.

  stale-devices:
    status: exempt
    comment: Panel devices and management entities carry exact config-subentry associations, so Home Assistant removes their ownership with the deleted panel subentry.

  # =============================================================================
  # Platinum Tier (Technical Excellence)
  # =============================================================================

  async-dependency:
    status: done
    comment: Panel SSH uses awaited asyncssh APIs; MQTT device-principal work uses aiomqtt's async API with Paho behind that adapter.

  inject-websession:
    status: done
    comment: The only HTTP is the optional voice-payload download (voice_payload.py), which uses HA's shared session via async_get_clientsession(hass); panel I/O is SSH (asyncssh) and broker I/O is HA's mqtt integration.

  strict-typing:
    status: done
    comment: py.typed marker present; mypy --strict passes over custom_components and tests.
